<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fat Loss Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="app-header">
    <div class="brand-block">
      <div class="brand-mark">FL</div>
      <div>
        <h1>Fat Loss Tracker</h1>
        <p>20 lb body fat cut plan</p>
      </div>
    </div>
    {% if session.get('user_id') %}
    <nav class="top-nav">
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('workouts') }}">Workouts</a>
      <a href="{{ url_for('plan') }}">Plan</a>
      <a href="{{ url_for('data_management') }}">Data</a>
      <a href="{{ url_for('settings') }}">Settings</a>
      <a href="{{ url_for('logout') }}">Logout</a>
    </nav>
    {% endif %}
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
