{% extends "base.html" %}
{% block content %}
<section class="card edit-card">
  <div class="section-title">
    <div>
      <h2>Edit measurement</h2>
      <p class="small">Update your body measurement entry.</p>
    </div>
    <a class="mini-button" href="{{ url_for('data_management') }}">Back</a>
  </div>
  <form method="post" class="form-grid">
    <label>Date<input type="date" name="measure_date" value="{{ entry.measure_date }}"></label>
    <label>Waist<input type="number" step="0.1" name="waist" value="{{ entry.waist or '' }}"></label>
    <label>Chest<input type="number" step="0.1" name="chest" value="{{ entry.chest or '' }}"></label>
    <label>Arm<input type="number" step="0.1" name="arm" value="{{ entry.arm or '' }}"></label>
    <label>Thigh<input type="number" step="0.1" name="thigh" value="{{ entry.thigh or '' }}"></label>
    <label class="wide">Notes<input name="notes" value="{{ entry.notes or '' }}"></label>
    <button>Save changes</button>
  </form>
</section>
{% endblock %}
