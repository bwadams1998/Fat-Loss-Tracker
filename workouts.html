{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h2>{% if first_user %}Create your login{% else %}Login{% endif %}</h2>
  <form method="post" class="grid">
    <label>Email<input name="email" type="email" required></label>
    <label>Password<input name="password" type="password" required></label>
    <button>{% if first_user %}Create account{% else %}Login{% endif %}</button>
  </form>
  <p class="small">First account becomes the owner. Use a strong password before hosting online.</p>
</section>
{% endblock %}
