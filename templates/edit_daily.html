{% extends "base.html" %}
{% block content %}
<section class="card edit-card">
  <div class="section-title">
    <div>
      <h2>Edit daily log</h2>
      <p class="small">Fix the numbers, then save.</p>
    </div>
    <a class="mini-button" href="{{ url_for('data_management') }}">Back</a>
  </div>
  <form method="post" class="form-grid">
    <label>Date<input type="date" name="log_date" value="{{ entry.log_date }}"></label>
    <label>Weight<input type="number" step="0.1" name="weight" value="{{ entry.weight or '' }}"></label>
    <label>Calories<input type="number" name="calories" value="{{ entry.calories or '' }}"></label>
    <label>Protein<input type="number" name="protein" value="{{ entry.protein or '' }}"></label>
    <label>Steps<input type="number" name="steps" value="{{ entry.steps or '' }}"></label>
    <label>Cardio minutes<input type="number" name="cardio_minutes" value="{{ entry.cardio_minutes or '' }}"></label>
    <label class="wide">Notes<input name="notes" value="{{ entry.notes or '' }}"></label>
    <button>Save changes</button>
  </form>
</section>
{% endblock %}
